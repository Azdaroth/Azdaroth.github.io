# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.url }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.



url: https://karolgalanciak.com
legacy_url: http://karolgalanciak.com
title: Karol Galanciak
main_header: Karol Galanciak
tagline: Build the product. Grow the team. Move the business forward.
author: Karol Galanciak
simple_search: https://google.com/search
description: >-
  I help founders turn growth plans into product direction, the right team, and working software - and lead the changes alongside them.
keywords: >-
  product and engineering leadership, product strategy, engineering economics, team development,
  hands-on engineering, AI-native workflows, cloud cost
  optimisation, product engineering leadership, Ruby on Rails, Kafka, distributed systems

# source: source
destination: _site
sass:
  sass_dir: _sass
  style: compressed # expanded

title: Karol Galanciak
description: >-
  I help founders turn growth plans into product direction, the right team, and working software - and lead the changes alongside them.
baseurl: "" # the subpath of your site, e.g. /blog
excerpt_link: "Read on &rarr;"  # "Continue reading" link text at the bottom of excerpted articles

twitter_username: Azdaroth
github_username:  Azdaroth

# Universal Analytics stopped collecting in 2023. GA4 replaces it and only loads
# after the visitor consents (_includes/consent.html).
google_analytics: "G-9TED91E6TB"
disqus_shortname: "karolgalanciak"
disqus_short_name: karolgalanciak
disqus_show_comment_count: false
disqus_site_shortname: "karolgalanciak"

comments: true

repository: Azdaroth/Azdaroth.github.io

# Build settings
# theme: plainwhite
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

feed:
  path: atom.xml

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  sort_field: "date"
  sort_reverse: true

permalink: /blog/:year/:month/:day/:title/

# Every post defaults to the engineering archive. This is what keeps the split
# free of URL changes: /engineering/ and /blog/ are VIEWS over the same posts,
# so all 75 permalinks and every inbound link survive untouched.
# A new essay opts out with `section: essays` in its own front matter.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      section: engineering

author:
  name: Karol Galanciak
  job:  co-founder and CPTO
  bio: ""
  thumb: /assets/images/me_formal_thumb.jpg
  url: https://karolgalanciak.com
  github: https://github.com/Azdaroth
  twitter: https://twitter.com/Azdaroth
  linkedin: https://www.linkedin.com/in/karol-galanciak-64b25381

# Primary navigation. Writing is deferred to the local Website V2 plan.
navbar:
  - slug: assessment/
    title: Assessment
  - slug: about
    title: About
  - slug: contact
    title: Contact

getformID: 6871b8f1-dfe1-45d6-811d-e57c576652eb

recaptcha:
  site_key: 6LdoSeoUAAAAAJB5Lr4zt-8J6twWRtJ05B6pDiId

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/



markdown: kramdown


