---
layout: pages
---

<article role="article" class="page">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  {% if page.portrait %}
    <figure class="page-portrait rail">
      <img src="{{ page.portrait | prepend: site.baseurl }}" alt="{{ page.portrait_alt | default: site.author.name }}" class="dot">
    </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
