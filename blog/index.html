---
layout: pages
title: Blog
pagination:
  enabled: true
footer: false
---

<div class="page blog-index">
  <header class="post-header">
    <h1 class="post-title">Blog</h1>
    <span class="post-meta">{{ site.posts | size }} articles &middot; {{ site.posts.last.date | date: "%Y" }}&ndash;{{ site.posts.first.date | date: "%Y" }}</span>
  </header>

  <section class="post-list">
    {% for post in site.posts %}
      {% include article.html %}
    {% endfor %}
  </section>
</div>
